name: Duplex 03.1 atomic supersession DEV
on:
  pull_request:
    paths:
      - 'auditory-intelligence/duplex-policy-repair-03-1/**'
      - '.github/workflows/duplex-policy-repair-03-1.yml'
  push:
    branches: [main]
    paths:
      - 'auditory-intelligence/duplex-policy-repair-03-1/**'
      - '.github/workflows/duplex-policy-repair-03-1.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11','3.13']
    defaults:
      run:
        working-directory: auditory-intelligence/duplex-policy-repair-03-1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify frozen source and receipt hashes
        run: sha256sum -c receipts/CHECKSUMS.sha256
      - name: Run versioned atomic supersession regressions
        run: python -m unittest discover -s tests -v
