name: Auditory DEV-01 synthetic WAV timing
on:
  push:
    branches: [main]
    paths:
      - 'auditory-intelligence/dev-01/**'
      - '.github/workflows/auditory-dev-01.yml'
  pull_request:
    paths:
      - 'auditory-intelligence/dev-01/**'
      - '.github/workflows/auditory-dev-01.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    defaults:
      run:
        working-directory: auditory-intelligence/dev-01
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test synthetic PCM signal integrity and timing
        run: |
          python -m unittest discover -s tests -v
          python run.py
