name: Agent Collaboration Lab D1 intake DEV
on:
  push:
    branches: [main]
    paths:
      - 'agent-collaboration-lab/d1-feasibility/**'
      - '.github/workflows/d1-feasibility.yml'
  pull_request:
    paths:
      - 'agent-collaboration-lab/d1-feasibility/**'
      - '.github/workflows/d1-feasibility.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    defaults:
      run:
        working-directory: agent-collaboration-lab/d1-feasibility
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Execute synthetic-only intake tests
        run: |
          python -m unittest discover -s tests -v
          python audit.py examples/synthetic_only.json
