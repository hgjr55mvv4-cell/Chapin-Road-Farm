name: Auditory transport repair v01 DEV
on:
  pull_request:
    paths:
      - 'auditory-intelligence/dev-01-transport-v01/**'
      - '.github/workflows/auditory-transport-v01.yml'
  push:
    branches: [main]
    paths:
      - 'auditory-intelligence/dev-01-transport-v01/**'
      - '.github/workflows/auditory-transport-v01.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    defaults:
      run:
        working-directory: auditory-intelligence/dev-01-transport-v01
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Bounded transport + known event-association limitations
        run: python -m unittest discover -s tests -v
