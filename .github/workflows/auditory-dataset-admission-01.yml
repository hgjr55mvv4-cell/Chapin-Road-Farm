name: Auditory DataSED admission gate (synthetic fixtures only)
on:
  pull_request:
    paths:
      - 'auditory-intelligence/dataset-admission-01/**'
      - '.github/workflows/auditory-dataset-admission-01.yml'
  push:
    branches: [main]
    paths:
      - 'auditory-intelligence/dataset-admission-01/**'
      - '.github/workflows/auditory-dataset-admission-01.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    defaults:
      run:
        working-directory: auditory-intelligence/dataset-admission-01
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test data admission against synthetic fixtures; no DataSED recordings
        run: |
          python -m unittest discover -s tests -v
          python -m py_compile admission.py
