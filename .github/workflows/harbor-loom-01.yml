name: Harbor LOOM-01 symbolic preflight
on:
  push:
    branches: [main]
    paths:
      - 'harbor-co-listener/loom-01/**'
      - '.github/workflows/harbor-loom-01.yml'
  pull_request:
    paths:
      - 'harbor-co-listener/loom-01/**'
      - '.github/workflows/harbor-loom-01.yml'
permissions:
  contents: read
jobs:
  symbolic:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11','3.13']
    defaults:
      run:
        working-directory: harbor-co-listener/loom-01
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Execute deterministic symbolic LOOM DEV
        run: |
          python -m unittest discover -s tests -v
          python loom.py --seed 20261023 --sets 64
