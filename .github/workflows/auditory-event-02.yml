name: Auditory event association DEV-02
on:
  pull_request:
    paths:
      - 'auditory-intelligence/event-increment-02/**'
      - '.github/workflows/auditory-event-02.yml'
  push:
    branches: [main]
    paths:
      - 'auditory-intelligence/event-increment-02/**'
      - '.github/workflows/auditory-event-02.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    defaults:
      run:
        working-directory: auditory-intelligence/event-increment-02
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Execute unit tests and synthetic matched source event comparisons
        run: |
          python -m unittest discover -s tests -v
          python event_dev.py --pairs 400 --seed 20261023 --out ci_results.json
          python export_cases.py --pairs 400 --out ci_cases.csv
          python -c "import json,csv; r=json.load(open('ci_results.json')); e=r['energy']['counts'];f=r['frequency']['counts']; rows=list(csv.DictReader(open('ci_cases.csv'))); assert len(rows)==800; assert f['positives']==400 and f['negatives']==400; assert f['match_with_right_times']==314 and f['no_match_positive']==86 and f['false_match_negative']==0; assert e['false_match_negative']==184 and e['unverified_identity_positive']==168; print('Engineering counts match source:', f['match_with_right_times'], f['no_match_positive'], e['false_match_negative'])"
