name: Duplex Policy Repair 03 mock regression
on:
  pull_request:
    paths:
      - 'auditory-intelligence/duplex-policy-repair-03/**'
      - '.github/workflows/duplex-policy-repair-03.yml'
  push:
    branches: [main]
    paths:
      - 'auditory-intelligence/duplex-policy-repair-03/**'
      - '.github/workflows/duplex-policy-repair-03.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11','3.13']
    defaults:
      run:
        working-directory: auditory-intelligence/duplex-policy-repair-03
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Versioned mock-only tests
        run: python -m unittest discover -s tests -v
